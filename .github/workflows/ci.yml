name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ft_transcendence_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ft_transcendence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ft_transcendence_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate --schema backend/prisma/schema.prisma

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy --schema backend/prisma/schema.prisma

      - name: Build project
        run: npm run build

      - name: Lint project
        run: npm run lint

      - name: Run backend tests
        run: npm run test --workspace=backend

      - name: Run frontend tests
        run: npm run test --workspace=frontend