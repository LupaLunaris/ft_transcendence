networks:
  ft_network:
    driver: bridge

volumes:
  postgres_data:
  vault_data:
  vault_logs:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ft_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.17
    container_name: vault
    restart: unless-stopped
    environment:
      - SKIP_CHOWN=1
      - VAULT_ADDR=https://127.0.0.1:8200
      - VAULT_CACERT=/vault/certs/ca-cert.pem
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault/config:/vault/config
      - ./vault/certs:/vault/certs:ro
      - vault_data:/vault/file
      - vault_logs:/vault/logs
    networks:
      - ft_network
    command: server
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--no-check-certificate", "https://127.0.0.1:8200/v1/sys/health?standbyok=true"]
      interval: 10s
      timeout: 5s
      retries: 5

  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: waf
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - BACKEND=http://backend:3001
      - MODSEC_RULE_ENGING=ON
      - PARANOIA=1
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=4
      - ALLOWED_METHODS=GET HEAD POST PUT DELETE OPTIONS
      - PORT=8080
      - SSL_PORT=8443
      - MODSEC_AUDIT_LOG=/tmp/modsec_audit.log
      - MODSEC_AUDIT_LOG_FORMAT=JSON
      - MODSEC_AUDIT_LOG_TYPE=Serial
    volumes:
      - ./nginx/modsec/modsecurity.conf:/etc/nginx/modsec/modsecurity.conf:ro
    networks:
      - ft_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
    environment:
      VAULT_ADDR: https://vault:8200
      VAULT_ROLE_ID: ${VAULT_ROLE_ID}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID}
      VAULT_CACERT: /vault/certs/ca-cert.pem
      NODE_EXTRA_CA_CERTS: /vault/certs/ca-cert.pem
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      NODE_ENV: ${NODE_ENV}
    #ports:
    #  - "3001:3001"
    networks:
      - ft_network
    volumes:
      - ./backend/src:/app/backend/src
      - ./vault/certs:/vault/certs:ro
      - /app/node_modules
      - /app/backend/node_modules

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: /api/v1
      VITE_BACKEND_URL: ${BACKEND_URL}
      BACKEND_INTERNAL_URL: http://waf:8080
      NODE_ENV: development
      VITE_HMR_HOST: localhost
      VITE_HMR_PORT: 443
      VITE_HMR_PROTOCOL: wss
    networks:
      - ft_network
    volumes:
      - ./frontend/src:/app/frontend/src
      - /app/node_modules
      - /app/frontend/node_modules

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      -frontend
      -waf
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ngingx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./vault/certs:/etc/