#Modsecurity conf
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess On
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html application/json
SecDataDir /tmp/modsecurity

#request body limits
SecRequestBodyLimit 10485760
SecRequestBodyNoFilesLimit 131072

#response body limits
SecResponseBodyLimit 10485760

#Logging
SecAuditEnging RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLog /var/log/nginx/modsec_audit.log
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial

SecAction \
  "id:900000,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.paranoia_level=1"

# Enabling anomaly scoring mode
SecAction \
  "id:900001,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.blocking_inbound_anomaly_score_threshold=5,\
  setvar:tx.blocking_outbound_anomaly_score_threshold=4"
